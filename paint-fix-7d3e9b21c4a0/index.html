<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>小畫家更新</title>
<style>
:root{--bg:#fffbe8;--card:#ffffff;--ink:#222;--sub:#555;--btn:#0a6ed1;--btn-ink:#fff;--line:#e3d9a8;--ok:#1b7f3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1b;--card:#2a2a2a;--ink:#f3f3f3;--sub:#c4c4c4;--btn:#4aa3ff;--btn-ink:#06213d;--line:#444;--ok:#6fd58c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:24px;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:34px;margin:8px 0 4px;line-height:1.3}
.why{color:var(--sub);font-size:22px;margin:0 0 20px}
.step{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px 18px;margin:14px 0;display:flex;gap:14px;align-items:flex-start}
.n{flex:none;width:48px;height:48px;border-radius:50%;background:var(--btn);color:var(--btn-ink);font-weight:700;font-size:28px;display:flex;align-items:center;justify-content:center}
.step b{font-size:28px}
a.go{display:block;text-align:center;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700;font-size:34px;padding:24px 12px;border-radius:20px;margin:10px 0 4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
a.go:active{transform:translateY(3px);box-shadow:none}
.done{color:var(--ok);font-weight:700;font-size:30px;text-align:center;margin:22px 0}
details{background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:12px 18px;font-size:22px}
summary{font-size:24px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<main>
<h1>🎨 小畫家 更新</h1>
<p class="why">小畫家有個安全漏洞,微軟已經修好了,請更新一下,只要 1 分鐘。</p>

<div class="step"><div class="n">1</div><div><b>按下面藍色大按鈕</b></div></div>
<a class="go" href="ms-windows-store://downloadsandupdates">👉 按我更新</a>

<div class="step"><div class="n">2</div><div><b>跳出視窗問「要開啟 Microsoft Store 嗎?」</b><br>按「<b>開啟</b>」</div></div>

<div class="step"><div class="n">3</div><div><b>商店打開後,按右上角「取得更新」</b><br>等它跑完就好</div></div>

<p class="done">✅ 跑完就完成了!</p>

<details>
<summary>按了沒反應?點這裡</summary>
<p>1. 按鍵盤左下角的 <b>Windows 鍵</b>(旗子圖案)<br>
2. 打字:<b>Microsoft Store</b>,按 Enter<br>
3. 商店左邊最下面按「<b>媒體櫃</b>」<br>
4. 按右上角「<b>取得更新</b>」</p>
<p>還是不行,可能是單位限制,請找資訊同仁幫忙。</p>
</details>
</main>
</body>
</html>
