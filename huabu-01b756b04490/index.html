<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>油畫班畫布團購</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* 版面:上方總計帶 → 登記表單 → 各人明細 → 各尺寸合計;單價表收在可展開區 */
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1c2430; --muted:#66707e; --line:#d5dae1;
  --accent:#2c4a9a; --accent-ink:#ffffff; --ochre:#9a6a12; --danger:#b3322a; --soft:#e4e9f4;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","PMingLiU",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --panel:#1d2430; --ink:#e8ebf0; --muted:#9aa3b0; --line:#323b4a;
  --accent:#8fa8f0; --accent-ink:#10162a; --ochre:#e0b34f; --danger:#ef8a80; --soft:#26304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --panel:#1d2430; --ink:#e8ebf0; --muted:#9aa3b0; --line:#323b4a;
  --accent:#8fa8f0; --accent-ink:#10162a; --ochre:#e0b34f; --danger:#ef8a80; --soft:#26304a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-size:24px;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{border-color:transparent;color:var(--muted);padding:6px 10px}
button.danger{color:var(--danger)}
.rounds{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rounds select{max-width:60vw}
.total{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.total small{opacity:.85;display:block}
.total .big{font-family:var(--serif);font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.total .meta{text-align:right;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.qty{display:flex;gap:6px;align-items:center}
.qty input{width:100%;text-align:center}
.person{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.person:first-of-type{border-top:0;padding-top:0;margin-top:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phead b{font-size:17px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.sub{color:var(--ochre)}
.line{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.line .nm{flex:1 1 130px;min-width:0}
.line .nm small{color:var(--muted);margin-left:4px}
.step{display:flex;align-items:center;gap:4px}
.step button{padding:2px 10px;line-height:1.4}
.step span{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.line .amt{min-width:4.5em;text-align:right}
.empty{color:var(--muted);padding:6px 0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:500}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.tbl input{width:5.5em;text-align:right}
details summary{cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--muted)}
details[open] summary{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:12px/1.4 ui-monospace,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
.banner{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:12px;font-weight:700;color:var(--ochre)}
.person.me{background:var(--soft);margin-inline:-8px;padding:10px 8px;border-radius:8px;border-top:0}
.rounds{align-items:center}
button:disabled,input:disabled,select:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:2px;background:var(--soft);border-radius:16px;padding:2px 4px 2px 12px}
.chip button{padding:2px 8px}
</style>

<div class="wrap">
  <div id="gate" hidden>
    <h1>油畫班畫布團購</h1>
    <section class="panel" style="margin-top:16px">
      <h2>進入班級</h2>
      <div class="form">
        <label class="full">班級暗號(班長會告訴大家)
          <input id="code" autocomplete="off" placeholder="例如班長給的那一串字">
        </label>
        <button class="primary full" id="enter">進入</button>
      </div>
      <p class="hint" id="gateMsg" style="margin:10px 0 0"></p>
    </section>
    <section class="panel" style="margin-top:16px">
      <details id="createBox">
        <summary>我是班長,要建立新班級</summary>
        <div class="form" style="margin-top:4px">
          <label class="full">班級暗號(至少 4 個字,要夠長、別人猜不到)
            <input id="newCode" autocomplete="off">
          </label>
          <label class="full">管理密碼(至少 6 個字,只有班長知道,用來改單價、結單)
            <input id="newPw" type="password" autocomplete="new-password">
          </label>
          <button class="primary full" id="create">建立班級</button>
        </div>
        <p class="hint">建立後把「邀請連結」傳到班級 LINE 群組,同學點開就能直接登記。</p>
      </details>
    </section>
  </div>

  <div id="app" hidden>
    <div class="top">
      <h1>畫布團購</h1>
      <div class="rounds">
        <select id="roundSel" aria-label="選擇團購場次"></select>
        <button id="newRound" hidden>新增一場</button>
      </div>
    </div>

    <div class="total" aria-live="polite" style="margin-top:16px">
      <div><small id="roundName"></small><span class="big" id="grand">$0</span></div>
      <div class="meta"><small id="stateTxt">進行中</small><span id="cnt">0 片 / 0 人</span></div>
    </div>
    <div class="banner" id="closedBanner" hidden>這一場已結單,不能再登記或修改。</div>

    <section class="panel" id="formBox" style="margin-top:16px">
      <h2>登記我要買的</h2>
      <div class="form">
        <label class="full">我的名字
          <select id="whoSel" hidden></select>
          <input id="who" autocomplete="name" placeholder="例如:王小美" maxlength="40">
        </label>
        <label>尺寸
          <select id="size"></select>
        </label>
        <label>片數
          <div class="qty">
            <button type="button" id="qm" aria-label="減一片">−</button>
            <input id="qty" type="number" inputmode="numeric" min="1" max="99" value="1">
            <button type="button" id="qp" aria-label="加一片">＋</button>
          </div>
        </label>
        <button class="primary full" id="add">加入</button>
      </div>
      <p class="hint" id="hint" style="margin:10px 0 0"></p>
    </section>

    <section class="panel" style="margin-top:16px">
      <h2>大家的登記</h2>
      <div id="people"></div>
    </section>

    <section class="panel" style="margin-top:16px">
      <h2>各尺寸合計</h2>
      <div id="bysize"></div>
    </section>

    <section class="panel" style="margin-top:16px">
      <details id="priceBox">
        <summary>單價表</summary>
        <div id="prices"></div>
        <div id="priceAdmin" hidden>
          <div class="row" style="margin-top:10px">
            <select id="addSize" aria-label="新增尺寸"></select>
            <button id="addPrice">加到單價表</button>
          </div>
        </div>
        <p class="hint">F 人物、P 風景、M 海景。單價只有班長能改。</p>
      </details>
    </section>

    <section class="panel" style="margin-top:16px">
      <div class="row">
        <button class="primary" id="copy">複製成 LINE 文字</button>
        <button id="invite">複製邀請連結</button>
      </div>
      <div id="adminBox" style="margin-top:14px">
        <div id="adminOff" class="row">
          <button id="adminBtn" class="ghost">我是班長</button>
          <span id="pwRow" class="row" hidden>
            <input id="adminPw" type="password" placeholder="管理密碼" autocomplete="current-password" style="width:11em">
            <button id="adminGo">確認</button>
          </span>
        </div>
        <div id="adminOn" hidden>
          <h2>班長功能</h2>
          <label style="display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:12px">同學名單(一行一個名字,或用逗號隔開;建好後同學用選的,不用打字)
            <textarea id="rosterIn" style="min-height:70px" placeholder="王小美&#10;陳大華"></textarea>
          </label>
          <div class="row" style="margin-bottom:8px"><button id="rosterAdd">加入名單</button></div>
          <div id="rosterList" class="chips"></div>
          <div class="row" style="margin-top:14px">
            <button id="closeBtn">結單</button>
            <button id="renameBtn">改名</button>
            <button id="delRound" class="danger">隱藏這一場</button>
            <button id="adminOut" class="ghost">登出班長</button>
          </div>
        </div>
      </div>
      <p class="hint" style="margin-top:12px">班級:<span id="roomShow"></span> <button class="ghost" id="leave">換班級</button></p>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// 號數表:號 F P M(cm,長×短)
const RAW=`0|17.5x14|17.5x12|
1|22.5x15.5|22.5x14|
2|25.5x17.5|25.5x15.5|
3|27x22|27x19|27x16
4|33x24|33x21|33x19
5|35x27|35x24|35x22
6|41x31.5|41x27|41x24
8|45.5x38|45.5x33|45.5x27
10|53x45.5|53x41|53x33
12|60.5x50|60.5x45.5|60.5x41
15|65x53|65x50|65x45.5
20|72.5x60.5|72.5x53|72.5x50
25|80x65|80x60.5|80x53
30|91x72.5|91x65|91x60.5
40|100x80|100x72.5|100x65
50|116.5x91|116.5x80|116.5x72.5
60|130x97|130x89.5|130x80
80|145.5x112|145.5x97|145.5x89.5
100|162x130|162x112|162x97
120|194x130|194x112|194x97
150|227x182|227x162|227x145
200|259x194|259x182|259x162
300|291x218|291x197|291x182
500|333x248|333x216|333x197`;
const SIZES=[];  // {label:'12P', cm:'60.5×45.5'}
RAW.split('\n').forEach(l=>{const p=l.split('|');['F','P','M'].forEach((t,i)=>{if(p[i+1])SIZES.push({label:p[0]+t,cm:p[i+1].replace('x','×')})})});
const CM={};SIZES.forEach(s=>CM[s.label]=s.cm);


firebase.initializeApp({
  apiKey:"AIzaSyBVwRQZ8huWsmrVtl8quD6z_BjYNFWAM48",
  authDomain:"huabu-groupbuy.firebaseapp.com",
  projectId:"huabu-groupbuy",
  storageBucket:"huabu-groupbuy.firebasestorage.app",
  messagingSenderId:"156535837517",
  appId:"1:156535837517:web:48ee56a55a4a0f5bc05d04"
});
const db=firebase.firestore(), FV=firebase.firestore.FieldValue;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=n=>'$'+Math.round(n).toLocaleString('en-US');
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,2200)}
function sortSize(a,b){const pa=parseInt(a),pb=parseInt(b);if(pa!==pb)return pa-pb;return 'FPM'.indexOf(a.slice(-1))-'FPM'.indexOf(b.slice(-1))}
async function derive(room,pw){
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode('huabu:'+room),iterations:150000},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}

let roster=[], unsubM=null;
let room=null, adminHash='', isAdmin=false, rounds=[], cur=null, orders=[], unsubR=null, unsubO=null;
const R=()=>rounds.find(r=>r.id===cur)||null;
const oq=o=>Math.max(0,Math.floor(Number(o.qty))||0);
const price=(r,l)=>r?(+(r.prices||{})[l]||0):0;
const roomRef=()=>db.collection('rooms').doc(room);
const roundRef=id=>roomRef().collection('rounds').doc(id);
const ordersCol=id=>roundRef(id).collection('orders');
// 班長的寫入:同一批次附上「班長證明」,規則會檢查密碼雜湊
async function adminBatch(fn){
  const b=db.batch();
  b.set(roomRef().collection('proofs').doc('p'),{hash:adminHash,t:FV.serverTimestamp()});
  fn(b);await b.commit();
}

function goodCode(c){return c.length>=4&&c.length<=40&&!/[\/\\#?\s]/.test(c)&&c!=='.'&&c!=='..'}
function errMsg(e){return e&&e.code==='permission-denied'?'這一場已結單,不能再改':'沒有成功,請檢查網路後再試一次'}

// 進入班級
async function openRoom(code){
  $('gateMsg').textContent='';
  if(!goodCode(code)){$('gateMsg').textContent='暗號至少 4 個字,不能有空白或 / # ?';return false}
  try{
    const d=await db.collection('rooms').doc(code).collection('meta').doc('room').get();
    if(!d.exists){$('gateMsg').textContent='找不到這個班級。請確認暗號,或由班長建立新班級。';return false}
    room=code;adminHash='';lsSet('hb-room',code);
    try{history.replaceState(null,'','#'+encodeURIComponent(code))}catch(e){}
    $('gate').hidden=true;$('app').hidden=false;$('roomShow').textContent=code;
    $('who').value=lsGet('hb-me')||'';
    isAdmin=false;startRounds();applyAdmin();
    const saved=lsGet('hb-admin-'+code);
    if(saved){adminHash=saved;try{await adminBatch(()=>{});isAdmin=true}catch(e){adminHash='';lsDel('hb-admin-'+code)}applyAdmin();render()}
    return true;
  }catch(e){$('gateMsg').textContent='連不上,請檢查網路後再試。';return false}
}
$('enter').onclick=()=>openRoom($('code').value.trim());
$('code').onkeydown=e=>{if(e.key==='Enter')$('enter').click()};
$('create').onclick=async()=>{
  const c=$('newCode').value.trim(),pw=$('newPw').value;
  if(!goodCode(c)){toast('暗號至少 4 個字,不能有空白或 / # ?');return}
  if(pw.length<6){toast('管理密碼至少 6 個字');return}
  try{
    const h=await derive(c,pw);
    const rr=db.collection('rooms').doc(c);const first=rr.collection('rounds').doc();
    const b=db.batch();
    b.set(rr.collection('meta').doc('room'),{created:Date.now()});
    b.set(rr.collection('private').doc('secret'),{hash:h});
    b.set(rr.collection('proofs').doc('p'),{hash:h,t:FV.serverTimestamp()});
    b.set(first,{name:'第 1 次團購',prices:{'6F':0,'8F':0,'10F':0,'12F':0,'12P':0,'15F':0},closed:false,created:Date.now()});
    await b.commit();
    lsSet('hb-admin-'+c,h);lsSet('hb-round-'+c,first.id);
    if(await openRoom(c))toast('班級建好了,按「複製邀請連結」傳給同學');
  }catch(e){toast(e&&e.code==='permission-denied'?'這個暗號已經有人用了,換一個':'沒有成功,請再試一次')}
};
$('leave').onclick=()=>{
  if(unsubR)unsubR();if(unsubO)unsubO();if(unsubM)unsubM();unsubR=unsubO=unsubM=null;roster=[];
  lsDel('hb-room');room=null;rounds=[];orders=[];cur=null;isAdmin=false;
  try{history.replaceState(null,'','#')}catch(e){}
  $('app').hidden=true;$('gate').hidden=false;$('code').value='';
};

// 即時資料
function startRoster(){
  if(unsubM)unsubM();
  unsubM=roomRef().collection('roster').doc('list').onSnapshot(d=>{
    const n=d.exists&&Array.isArray(d.data().names)?d.data().names:[];
    roster=n.map(x=>String(x).slice(0,40)).filter(Boolean);renderRoster();render();
  },e=>{});
}
function renderRoster(){
  const sel=$('whoSel'),inp=$('who'),use=roster.length>0;
  sel.hidden=!use;inp.hidden=use;
  if(use){
    const saved=inp.value.trim()||lsGet('hb-me')||'';
    sel.innerHTML='<option value="">— 請選你的名字 —</option>'+roster.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    sel.value=roster.includes(saved)?saved:'';inp.value=sel.value;
  }
  $('rosterList').innerHTML=roster.length?roster.map(n=>`<span class="chip">${esc(n)}<button class="ghost danger" data-rn="${esc(n)}" aria-label="從名單移除 ${esc(n)}">✕</button></span>`).join(''):'<span class="hint">還沒建名單,同學目前是自己打名字。</span>';
}
function startRounds(){
  if(unsubR)unsubR();
  startRoster();
  unsubR=roomRef().collection('rounds').orderBy('created').onSnapshot(snap=>{
    rounds=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>!r.archived);
    const saved=lsGet('hb-round-'+room);
    if(!rounds.some(r=>r.id===cur))cur=(rounds.some(r=>r.id===saved)?saved:(rounds.length?rounds[rounds.length-1].id:null));
    watchOrders();render();
  },e=>toast('連線失敗,請重新整理'));
}
let watching=null;
function watchOrders(){
  if(watching===cur)return;watching=cur;
  if(unsubO){unsubO();unsubO=null}orders=[];
  if(!cur)return;
  unsubO=ordersCol(cur).onSnapshot(snap=>{orders=snap.docs.map(d=>({id:d.id,...d.data()}));render()},e=>toast('連線失敗,請重新整理'));
}
async function makeRound(name,prices){
  const ref=roomRef().collection('rounds').doc();
  await adminBatch(b=>b.set(ref,{name,prices,closed:false,created:Date.now()}));
  cur=ref.id;lsSet('hb-round-'+room,cur);watching=null;watchOrders();
}

// 畫面
function applyAdmin(){
  $('adminOff').hidden=isAdmin;$('adminOn').hidden=!isAdmin;
  $('newRound').hidden=!isAdmin;$('priceAdmin').hidden=!isAdmin;
}
function groups(){const g={};orders.forEach(o=>{(g[o.person]=g[o.person]||[]).push(o)});return g}
function render(){
  if(!room)return;
  const r=R();
  $('roundSel').innerHTML=rounds.map(x=>`<option value="${esc(x.id)}"${x.id===cur?' selected':''}>${esc(x.name)}</option>`).join('');
  if(!r){
    $('roundName').textContent='';$('grand').textContent='$0';$('cnt').textContent='';
    $('people').innerHTML='<div class="empty">班長還沒有開團購場次。</div>';$('bysize').innerHTML='';$('prices').innerHTML='';$('formBox').hidden=true;return;
  }
  const closed=!!r.closed;
  $('formBox').hidden=false;
  $('closedBanner').hidden=!closed;$('stateTxt').textContent=closed?'已結單':'進行中';
  $('closeBtn').textContent=closed?'重新開放':'結單';
  ['who','whoSel','size','qty','qm','qp','add'].forEach(i=>$(i).disabled=closed);
  $('roundName').textContent=(r.name||'')+' 總計';
  const g=groups();let grand=0,pieces=0;
  orders.forEach(o=>{grand+=price(r,o.size)*oq(o);pieces+=oq(o)});
  $('grand').textContent=$$(grand);
  $('cnt').textContent=pieces+' 片 / '+Object.keys(g).length+' 人';

  const labels=Object.keys(r.prices||{}).sort(sortSize);
  const sel=$('size').value;
  $('size').innerHTML=labels.filter(l=>price(r,l)>0).map(l=>`<option value="${esc(l)}">${esc(l)}(${esc(CM[l]||'')}) ${$$(price(r,l))}</option>`).join('');
  if(labels.includes(sel))$('size').value=sel;
  const noPrice=labels.filter(l=>!price(r,l));
  $('hint').textContent=!$('size').options.length?'班長還沒填單價,暫時不能登記。':(isAdmin&&noPrice.length?'還沒填單價:'+noPrice.join('、'):'');

  const me=$('who').value.trim();
  const names=Object.keys(g).sort((a,b)=>(b===me)-(a===me)||a.localeCompare(b,'zh-Hant'));
  $('people').innerHTML=names.length?names.map(n=>{
    let sub=0;const mine=n===me;
    const lines=g[n].sort((a,b)=>sortSize(a.size,b.size)).map(o=>{
      const a=price(r,o.size)*oq(o);sub+=a;
      const can=!closed&&(mine||isAdmin);
      const ctl=can?`<div class="step"><button data-a="dec" data-id="${esc(o.id)}" aria-label="減一片">−</button><span>${oq(o)}</span><button data-a="inc" data-id="${esc(o.id)}" aria-label="加一片">＋</button></div>`:`<div class="step"><span>×${oq(o)}</span></div>`;
      const del=can?`<button class="ghost danger" data-a="del" data-id="${esc(o.id)}" aria-label="刪除這筆">✕</button>`:'';
      return `<div class="line"><div class="nm"><b>${esc(o.size)}</b><small>${esc(CM[o.size]||'')}</small></div>${ctl}<div class="amt money">${$$(a)}</div>${del}</div>`}).join('');
    return `<div class="person${mine?' me':''}"><div class="phead"><b>${esc(n)}${mine?'(我)':''}</b><span class="money sub">小計 ${$$(sub)}</span></div>${lines}</div>`;
  }).join(''):'<div class="empty">還沒有人登記。填名字、選尺寸、按「加入」。</div>';

  const bs={};orders.forEach(o=>bs[o.size]=(bs[o.size]||0)+oq(o));
  const ks=Object.keys(bs).sort(sortSize);
  $('bysize').innerHTML=ks.length?`<table class="tbl"><tr><th>尺寸</th><th>單價</th><th>片數</th><th>金額</th></tr>`+ks.map(k=>`<tr><td><b>${esc(k)}</b> <span class="hint">${esc(CM[k]||'')}</span></td><td>${$$(price(r,k))}</td><td>${bs[k]}</td><td class="money">${$$(price(r,k)*bs[k])}</td></tr>`).join('')+`</table>`:'<div class="empty">登記後這裡會列出每種尺寸總共幾片。</div>';

  const act=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.p;
  if(!act){
    $('prices').innerHTML=labels.length?`<table class="tbl"><tr><th>尺寸</th><th>單價</th><th></th></tr>`+labels.map(l=>`<tr><td><b>${esc(l)}</b> <span class="hint">${esc(CM[l]||'')}</span></td><td style="text-align:left">${isAdmin?`<input type="number" inputmode="decimal" min="0" data-p="${esc(l)}" value="${price(r,l)||''}" placeholder="0" aria-label="${esc(l)} 單價">`:(price(r,l)?$$(price(r,l)):'未定')}</td><td>${isAdmin?`<button class="ghost danger" data-rm="${esc(l)}">移除</button>`:''}</td></tr>`).join('')+`</table>`:'<div class="empty">單價表是空的。</div>';
  }
  $('addSize').innerHTML=SIZES.filter(s=>!(s.label in (r.prices||{}))).map(s=>`<option value="${s.label}">${s.label}(${s.cm})</option>`).join('');
}
$('who').oninput=()=>{lsSet('hb-me',$('who').value.trim());render()};
$('whoSel').onchange=()=>{$('who').value=$('whoSel').value;lsSet('hb-me',$('who').value);render()};
async function saveRoster(names){
  await adminBatch(b=>b.set(roomRef().collection('roster').doc('list'),{names}));
}
$('rosterAdd').onclick=async()=>{
  const add=$('rosterIn').value.split(/[\n,，、]+/).map(x=>x.trim().slice(0,40)).filter(Boolean);
  if(!add.length){toast('先在上面打名字');return}
  const names=[...new Set([...roster,...add])].slice(0,100);
  try{await saveRoster(names);$('rosterIn').value='';toast('名單已更新')}catch(e){toast(errMsg(e))}
};
$('rosterList').onclick=async e=>{
  const b=e.target.closest('button[data-rn]');if(!b)return;
  try{await saveRoster(roster.filter(n=>n!==b.dataset.rn))}catch(er){toast(errMsg(er))}
};
$('roundSel').onchange=e=>{cur=e.target.value;lsSet('hb-round-'+room,cur);watchOrders();render()};

// 登記
$('qm').onclick=()=>{$('qty').value=Math.max(1,(+$('qty').value||1)-1)};
$('qp').onclick=()=>{$('qty').value=Math.min(99,(+$('qty').value||0)+1)};
$('add').onclick=async()=>{
  const r=R();if(!r)return;
  const p=$('who').value.trim().slice(0,40),sz=$('size').value,q=Math.min(99,Math.max(1,parseInt($('qty').value)||1));
  if(!p){toast(roster.length?'先選你的名字':'先填你的名字');return}
  if(!sz){toast('班長還沒填單價');return}
  lsSet('hb-me',p);
  try{
    await ordersCol(cur).doc((sz+'|'+p).replace(/\//g,'／')).set({person:p,size:sz,qty:FV.increment(q),t:Date.now()},{merge:true});
    $('qty').value=1;toast(p+' '+sz+' ×'+q+' 已加入');
  }catch(e){toast(errMsg(e))}
};
$('people').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const o=orders.find(x=>x.id===b.dataset.id);if(!o)return;
  const ref=ordersCol(cur).doc(o.id);
  const act=b.dataset.a;
  const run=async f=>{if(isAdmin)await adminBatch(bt=>f(bt));else{const bt=db.batch();f(bt);await bt.commit()}};
  try{
    if(act==='inc'){if(o.qty<99)await run(bt=>bt.update(ref,{qty:FV.increment(1)}))}
    else if(act==='dec'){if(o.qty>1)await run(bt=>bt.update(ref,{qty:FV.increment(-1)}));else await run(bt=>bt.delete(ref))}
    else await run(bt=>bt.delete(ref));
  }catch(er){toast(errMsg(er))}
};

// 單價(班長)
$('prices').onchange=async e=>{
  const l=e.target.dataset.p;if(!l||!isAdmin)return;
  try{await adminBatch(b=>b.update(roundRef(cur),{['prices.'+l]:Math.max(0,Number(e.target.value)||0)}))}catch(er){toast(errMsg(er))}
};
$('prices').onclick=async e=>{
  const b=e.target.closest('button[data-rm]');if(!b||!isAdmin)return;
  const l=b.dataset.rm;
  if(orders.some(o=>o.size===l)){toast(l+' 已有人登記,不能移除');return}
  try{await adminBatch(b=>b.update(roundRef(cur),{['prices.'+l]:FV.delete()}))}catch(er){toast(errMsg(er))}
};
$('addPrice').onclick=async()=>{
  const l=$('addSize').value;if(!l||!isAdmin)return;
  try{await adminBatch(b=>b.update(roundRef(cur),{['prices.'+l]:0}));toast(l+' 已加入,請填單價')}catch(er){toast(errMsg(er))}
};

// 班長
$('adminBtn').onclick=()=>{$('pwRow').hidden=false;$('adminBtn').hidden=true;$('adminPw').focus()};
$('adminPw').onkeydown=e=>{if(e.key==='Enter')$('adminGo').click()};
$('adminGo').onclick=async()=>{
  const pw=$('adminPw').value;if(!pw)return;
  try{
    adminHash=await derive(room,pw);
    await adminBatch(()=>{});
    isAdmin=true;lsSet('hb-admin-'+room,adminHash);$('adminPw').value='';$('pwRow').hidden=true;$('adminBtn').hidden=false;applyAdmin();render();toast('班長模式已開啟');
  }catch(e){adminHash='';toast(e&&e.code==='permission-denied'?'管理密碼不對':'沒有成功,請檢查網路後再試一次')}
};
$('adminOut').onclick=()=>{isAdmin=false;adminHash='';lsDel('hb-admin-'+room);applyAdmin();render()};
$('newRound').onclick=async()=>{
  const prev=R();
  try{await makeRound('第 '+(rounds.length+1)+' 次團購',prev?{...prev.prices}:{});toast('已新增一場,單價沿用上一場')}catch(e){toast(errMsg(e))}
};
$('closeBtn').onclick=async()=>{
  const r=R();if(!r)return;
  try{await adminBatch(b=>b.update(roundRef(cur),{closed:!r.closed}));toast(r.closed?'已重新開放':'已結單')}catch(e){toast(errMsg(e))}
};
$('renameBtn').onclick=()=>{
  const r=R();if(!r)return;const el=$('roundName'),inp=document.createElement('input');
  inp.value=r.name;inp.maxLength=60;inp.setAttribute('aria-label','場次名稱');el.replaceWith(inp);inp.focus();inp.select();
  let done=false;const fin=async()=>{if(done)return;done=true;const v=inp.value.trim();inp.replaceWith(el);
    if(v&&v!==r.name){try{await adminBatch(b=>b.update(roundRef(cur),{name:v}))}catch(e){toast(errMsg(e))}}};
  inp.onblur=fin;inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur()};
};
let confirmDel=0;
$('delRound').onclick=async()=>{
  const b=$('delRound');
  if(!confirmDel){confirmDel=1;b.textContent='再按一次確認隱藏';setTimeout(()=>{confirmDel=0;b.textContent='隱藏這一場'},3000);return}
  confirmDel=0;b.textContent='隱藏這一場';
  try{await adminBatch(bt=>bt.update(roundRef(cur),{archived:true}));cur=null;toast('已隱藏這一場')}catch(e){toast(errMsg(e))}
};

// 複製
function lineText(){
  const r=R(),g=groups();let grand=0;const out=['【'+r.name+'】'+(r.closed?'(已結單)':'')];
  Object.keys(g).sort((a,b)=>a.localeCompare(b,'zh-Hant')).forEach(n=>{
    let sub=0;out.push('',n);
    g[n].sort((a,b)=>sortSize(a.size,b.size)).forEach(o=>{const a=price(r,o.size)*oq(o);sub+=a;out.push(`  ${o.size} ×${oq(o)} = ${$$(a)}`)});
    out.push('  小計 '+$$(sub));grand+=sub;
  });
  const bs={};orders.forEach(o=>bs[o.size]=(bs[o.size]||0)+oq(o));
  out.push('','合計片數:'+Object.keys(bs).sort(sortSize).map(k=>k+'×'+bs[k]).join('、'),'總計 '+$$(grand));
  return out.join('\n');
}
async function copyText(t,msg){
  try{await navigator.clipboard.writeText(t);toast(msg)}
  catch(e){const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;left:0;top:0;width:90%;height:6em;z-index:50';document.body.appendChild(ta);ta.select();toast('請長按全選後複製,再點空白處關閉');ta.onblur=()=>ta.remove()}
}
$('copy').onclick=()=>{if(R())copyText(lineText(),'已複製,到 LINE 貼上')};
$('invite').onclick=()=>copyText(location.href.split('#')[0]+'#'+encodeURIComponent(room),'邀請連結已複製,貼到班級群組');

// 啟動
(async()=>{
  let c='';try{c=decodeURIComponent(location.hash.slice(1))}catch(e){}
  if(!c)c=lsGet('hb-room')||'';
  if(c){$('code').value=c;if(await openRoom(c))return}
  $('gate').hidden=false;
})();

</script>
</body></html>
