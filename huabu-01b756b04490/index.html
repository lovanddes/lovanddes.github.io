<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>畫布團購統計</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
html{color-scheme:light}body{margin:0}[hidden]{display:none!important}
/* 版面:上方總計帶 → 登記表單 → 各人明細 → 各尺寸合計;單價表收在可展開區 */
:root{
  --bg:#eef0f3; --panel:#ffffff; --ink:#1c2430; --muted:#66707e; --line:#d5dae1;
  --accent:#2c4a9a; --accent-ink:#ffffff; --ochre:#9a6a12; --danger:#b3322a; --soft:#e4e9f4;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","PMingLiU",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --panel:#1d2430; --ink:#e8ebf0; --muted:#9aa3b0; --line:#323b4a;
  --accent:#8fa8f0; --accent-ink:#10162a; --ochre:#e0b34f; --danger:#ef8a80; --soft:#26304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --panel:#1d2430; --ink:#e8ebf0; --muted:#9aa3b0; --line:#323b4a;
  --accent:#8fa8f0; --accent-ink:#10162a; --ochre:#e0b34f; --danger:#ef8a80; --soft:#26304a; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--serif);font-size:24px;margin:0;text-wrap:balance}
h2{font-size:13px;letter-spacing:.12em;color:var(--muted);margin:0 0 10px;font-weight:700}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
input,select,button{font:inherit;color:var(--ink)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
button.ghost{border-color:transparent;color:var(--muted);padding:6px 10px}
button.danger{color:var(--danger)}
.rounds{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.rounds select{max-width:60vw}
.total{background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:16px 18px;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.total small{opacity:.85;display:block}
.total .big{font-family:var(--serif);font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.total .meta{text-align:right;font-variant-numeric:tabular-nums}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.qty{display:flex;gap:6px;align-items:center}
.qty input{width:100%;text-align:center}
.person{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.person:first-of-type{border-top:0;padding-top:0;margin-top:0}
.phead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.phead b{font-size:17px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.sub{color:var(--ochre)}
.line{display:flex;align-items:center;gap:8px;padding:5px 0;flex-wrap:wrap}
.line .nm{flex:1 1 130px;min-width:0}
.line .nm small{color:var(--muted);margin-left:4px}
.step{display:flex;align-items:center;gap:4px}
.step button{padding:2px 10px;line-height:1.4}
.step span{min-width:1.6em;text-align:center;font-variant-numeric:tabular-nums}
.line .amt{min-width:4.5em;text-align:right}
.empty{color:var(--muted);padding:6px 0}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td,.tbl th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--muted);font-weight:500}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.tbl input{width:5.5em;text-align:right}
details summary{cursor:pointer;font-weight:700;font-size:13px;letter-spacing:.12em;color:var(--muted)}
details[open] summary{margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
textarea{width:100%;min-height:110px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px;font:12px/1.4 ui-monospace,monospace}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:14px}
.hint{font-size:13px;color:var(--muted)}
</style>

<div class="wrap">
  <div class="top">
    <h1>畫布團購統計</h1>
    <div class="rounds">
      <select id="roundSel" aria-label="選擇團購場次"></select>
      <button id="newRound">新增一場</button>
    </div>
  </div>

  <div class="total" aria-live="polite">
    <div><small id="roundName"></small><span class="big" id="grand">$0</span></div>
    <div class="meta"><small>共</small><span id="cnt">0 片 / 0 人</span></div>
  </div>

  <section class="panel">
    <h2>登記一筆</h2>
    <div class="form">
      <label class="full">誰買的
        <input id="who" list="names" placeholder="例如:亮亮" autocomplete="off">
        <datalist id="names"></datalist>
      </label>
      <label>尺寸
        <select id="size"></select>
      </label>
      <label>片數
        <div class="qty">
          <button type="button" id="qm" aria-label="減一片">−</button>
          <input id="qty" type="number" inputmode="numeric" min="1" value="1">
          <button type="button" id="qp" aria-label="加一片">＋</button>
        </div>
      </label>
      <button class="primary full" id="add">加入</button>
    </div>
    <p class="hint" id="hint" style="margin:10px 0 0"></p>
  </section>

  <section class="panel">
    <h2>各人明細</h2>
    <div id="people"></div>
  </section>

  <section class="panel">
    <h2>各尺寸合計(跟老闆下單用)</h2>
    <div id="bysize"></div>
  </section>

  <section class="panel">
    <details id="priceBox">
      <summary>單價表(這一場的價格)</summary>
      <div id="prices"></div>
      <div class="row" style="margin-top:10px">
        <select id="addSize" aria-label="新增尺寸"></select>
        <button id="addPrice">加到單價表</button>
      </div>
      <p class="hint">尺寸對照台灣通用畫布:F 人物、P 風景、M 海景。新增一場時會沿用上一場的單價。</p>
    </details>
  </section>

  <section class="panel">
    <div class="row">
      <button class="primary" id="copy">複製成 LINE 文字</button>
      <button id="delRound" class="danger ghost">刪除這一場</button>
    </div>
    <details style="margin-top:12px">
      <summary>備份 / 換手機</summary>
      <p class="hint">資料只存在這支手機的這個瀏覽器。要換裝置,按「產生備份碼」複製起來,到新的地方貼上再按「讀入備份」。</p>
      <textarea id="bk" aria-label="備份碼"></textarea>
      <div class="row" style="margin-top:8px"><button id="bkOut">產生備份碼</button><button id="bkIn">讀入備份</button></div>
    </details>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// 號數表:號 F P M(cm,長×短)
const RAW=`0|17.5x14|17.5x12|
1|22.5x15.5|22.5x14|
2|25.5x17.5|25.5x15.5|
3|27x22|27x19|27x16
4|33x24|33x21|33x19
5|35x27|35x24|35x22
6|41x31.5|41x27|41x24
8|45.5x38|45.5x33|45.5x27
10|53x45.5|53x41|53x33
12|60.5x50|60.5x45.5|60.5x41
15|65x53|65x50|65x45.5
20|72.5x60.5|72.5x53|72.5x50
25|80x65|80x60.5|80x53
30|91x72.5|91x65|91x60.5
40|100x80|100x72.5|100x65
50|116.5x91|116.5x80|116.5x72.5
60|130x97|130x89.5|130x80
80|145.5x112|145.5x97|145.5x89.5
100|162x130|162x112|162x97
120|194x130|194x112|194x97
150|227x182|227x162|227x145
200|259x194|259x182|259x162
300|291x218|291x197|291x182
500|333x248|333x216|333x197`;
const SIZES=[];  // {label:'12P', cm:'60.5×45.5'}
RAW.split('\n').forEach(l=>{const p=l.split('|');['F','P','M'].forEach((t,i)=>{if(p[i+1])SIZES.push({label:p[0]+t,cm:p[i+1].replace('x','×')})})});
const CM={};SIZES.forEach(s=>CM[s.label]=s.cm);

const KEY='canvas-groupbuy-v1';
let S=load();
function uid(){return Math.random().toString(36).slice(2,9)}
function load(){
  try{const t=localStorage.getItem(KEY);if(t){const d=JSON.parse(t);if(d&&d.rounds&&d.rounds.length)return d}}catch(e){}
  const id=uid();
  return{cur:id,rounds:[{id,name:'第 1 次團購',prices:{'6F':0,'8F':0,'10F':0,'12F':0,'12P':0,'15F':0},orders:[]}]};
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const R=()=>S.rounds.find(r=>r.id===S.cur)||S.rounds[0];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $$=n=>'$'+Math.round(n).toLocaleString('en-US');
const price=(r,l)=>+r.prices[l]||0;

function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,1800)}

function groups(r){
  const g={};r.orders.forEach(o=>{(g[o.person]=g[o.person]||[]).push(o)});return g;
}

function render(){
  const r=R();S.cur=r.id;
  $('roundSel').innerHTML=S.rounds.map(x=>`<option value="${x.id}"${x.id===r.id?' selected':''}>${esc(x.name)}</option>`).join('');
  $('roundName').textContent=r.name+' 總計';
  const g=groups(r);let grand=0,pieces=0;
  r.orders.forEach(o=>{grand+=price(r,o.size)*o.qty;pieces+=o.qty});
  $('grand').textContent=$$(grand);
  $('cnt').textContent=pieces+' 片 / '+Object.keys(g).length+' 人';

  // 尺寸下拉(只列單價表裡的)
  const labels=Object.keys(r.prices).sort(sortSize);
  const cur=$('size').value;
  $('size').innerHTML=labels.map(l=>`<option value="${l}">${l}(${CM[l]||''})${price(r,l)?' $'+price(r,l):' 未填價'}</option>`).join('');
  if(labels.includes(cur))$('size').value=cur;
  $('names').innerHTML=Object.keys(g).map(n=>`<option value="${esc(n)}">`).join('');
  const noPrice=labels.filter(l=>!price(r,l));
  $('hint').textContent=noPrice.length?'還沒填單價:'+noPrice.join('、')+'(到下面「單價表」填)':'';

  // 各人
  const names=Object.keys(g);
  $('people').innerHTML=names.length?names.map(n=>{
    let sub=0;
    const lines=g[n].map(o=>{const a=price(r,o.size)*o.qty;sub+=a;
      return `<div class="line"><div class="nm"><b>${o.size}</b><small>${CM[o.size]||''}</small></div>
      <div class="step"><button data-a="dec" data-id="${o.id}" aria-label="減一片">−</button><span>${o.qty}</span><button data-a="inc" data-id="${o.id}" aria-label="加一片">＋</button></div>
      <div class="amt money">${$$(a)}</div><button class="ghost danger" data-a="del" data-id="${o.id}" aria-label="刪除這筆">✕</button></div>`}).join('');
    return `<div class="person"><div class="phead"><b>${esc(n)}</b><span class="money sub">小計 ${$$(sub)}</span></div>${lines}</div>`;
  }).join(''):'<div class="empty">還沒有人登記。在上面填名字、選尺寸、按「加入」。</div>';

  // 各尺寸合計
  const bs={};r.orders.forEach(o=>bs[o.size]=(bs[o.size]||0)+o.qty);
  const ks=Object.keys(bs).sort(sortSize);
  $('bysize').innerHTML=ks.length?`<table class="tbl"><tr><th>尺寸</th><th>單價</th><th>片數</th><th>金額</th></tr>`+
    ks.map(k=>`<tr><td><b>${k}</b> <span class="hint">${CM[k]||''}</span></td><td>${$$(price(r,k))}</td><td>${bs[k]}</td><td class="money">${$$(price(r,k)*bs[k])}</td></tr>`).join('')+`</table>`:'<div class="empty">登記後這裡會列出每種尺寸總共幾片。</div>';

  // 單價表
  $('prices').innerHTML=labels.length?`<table class="tbl"><tr><th>尺寸</th><th>單價</th><th></th></tr>`+
    labels.map(l=>`<tr><td><b>${l}</b> <span class="hint">${CM[l]}</span></td>
    <td style="text-align:left"><input type="number" inputmode="decimal" min="0" data-p="${l}" value="${r.prices[l]||''}" placeholder="0" aria-label="${l} 單價"></td>
    <td><button class="ghost danger" data-rm="${l}" aria-label="移除 ${l}">移除</button></td></tr>`).join('')+`</table>`:'<div class="empty">單價表是空的,從下面加尺寸。</div>';
  const rest=SIZES.filter(s=>!(s.label in r.prices));
  $('addSize').innerHTML=rest.map(s=>`<option value="${s.label}">${s.label}(${s.cm})</option>`).join('');
  save();
}
function clean(d){
  if(!d||!Array.isArray(d.rounds)||!d.rounds.length)throw 0;
  const id=v=>/^[a-z0-9]{1,12}$/.test(v)?v:uid();
  const rounds=d.rounds.map(r=>{
    const prices={};Object.keys(r.prices||{}).forEach(k=>{if(k in CM)prices[k]=Math.max(0,Number(r.prices[k])||0)});
    const orders=(r.orders||[]).filter(o=>o&&o.size in CM).map(o=>({id:id(o.id),person:String(o.person||'').slice(0,40),size:o.size,qty:Math.max(1,Math.floor(Number(o.qty))||1)}));
    return{id:id(r.id),name:String(r.name||'團購').slice(0,60),prices,orders};
  });
  return{cur:rounds.some(r=>r.id===id(d.cur))?id(d.cur):rounds[0].id,rounds};
}
function sortSize(a,b){
  const pa=parseInt(a),pb=parseInt(b);if(pa!==pb)return pa-pb;return 'FPM'.indexOf(a.slice(-1))-'FPM'.indexOf(b.slice(-1));
}

$('roundSel').onchange=e=>{S.cur=e.target.value;render()};
$('newRound').onclick=()=>{
  const prev=R(),id=uid();
  S.rounds.push({id,name:'第 '+(S.rounds.length+1)+' 次團購',prices:{...prev.prices},orders:[]});
  S.cur=id;render();toast('已新增,單價沿用上一場');
};
$('qm').onclick=()=>{$('qty').value=Math.max(1,(+$('qty').value||1)-1)};
$('qp').onclick=()=>{$('qty').value=(+$('qty').value||0)+1};
$('add').onclick=()=>{
  const r=R(),p=$('who').value.trim(),sz=$('size').value,q=Math.max(1,parseInt($('qty').value)||1);
  if(!p){toast('先填是誰買的');$('who').focus();return}
  if(!sz){toast('先到單價表加尺寸');return}
  const ex=r.orders.find(o=>o.person===p&&o.size===sz);
  if(ex)ex.qty+=q;else r.orders.push({id:uid(),person:p,size:sz,qty:q});
  $('qty').value=1;render();toast(p+' '+sz+' ×'+q+' 已加入');
};
$('people').onclick=e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const r=R(),o=r.orders.find(x=>x.id===b.dataset.id);if(!o)return;
  if(b.dataset.a==='inc')o.qty++;
  else if(b.dataset.a==='dec'){o.qty--;if(o.qty<1)r.orders=r.orders.filter(x=>x!==o)}
  else r.orders=r.orders.filter(x=>x!==o);
  render();
};
$('prices').onchange=e=>{const l=e.target.dataset.p;if(l){R().prices[l]=Math.max(0,+e.target.value||0);render();$('priceBox').open=true}};
$('prices').onclick=e=>{
  const b=e.target.closest('button[data-rm]');if(!b)return;
  const r=R(),l=b.dataset.rm;
  if(r.orders.some(o=>o.size===l)){toast(l+' 已有人登記,不能移除');return}
  delete r.prices[l];render();$('priceBox').open=true;
};
$('addPrice').onclick=()=>{const l=$('addSize').value;if(!l)return;R().prices[l]=0;render();$('priceBox').open=true;toast(l+' 已加入,請填單價')};

let confirmDel=0;
$('delRound').onclick=()=>{
  const b=$('delRound');
  if(!confirmDel){confirmDel=1;b.textContent='再按一次確認刪除';setTimeout(()=>{confirmDel=0;b.textContent='刪除這一場'},3000);return}
  confirmDel=0;b.textContent='刪除這一場';
  if(S.rounds.length===1){const r=R();r.orders=[];toast('已清空這一場')}
  else{S.rounds=S.rounds.filter(x=>x.id!==S.cur);S.cur=S.rounds[S.rounds.length-1].id;toast('已刪除')}
  render();
};
// 場次改名:點總計帶上的名稱
$('roundName').style.cursor='pointer';$('roundName').title='點一下改名';
$('roundName').onclick=()=>{
  const r=R(),inp=document.createElement('input');inp.value=r.name;inp.setAttribute('aria-label','場次名稱');
  const el=$('roundName');el.replaceWith(inp);inp.focus();inp.select();
  const done=()=>{const v=inp.value.trim();if(v)r.name=v;inp.replaceWith(el);render()};
  inp.onblur=done;inp.onkeydown=ev=>{if(ev.key==='Enter')inp.blur()};
};

function lineText(){
  const r=R(),g=groups(r);let grand=0;
  const out=['【'+r.name+'】'];
  Object.keys(g).forEach(n=>{
    let sub=0;out.push('',n);
    g[n].forEach(o=>{const a=price(r,o.size)*o.qty;sub+=a;out.push(`  ${o.size} ×${o.qty} = ${$$(a)}`)});
    out.push('  小計 '+$$(sub));grand+=sub;
  });
  const bs={};r.orders.forEach(o=>bs[o.size]=(bs[o.size]||0)+o.qty);
  out.push('','合計片數:'+Object.keys(bs).sort(sortSize).map(k=>k+'×'+bs[k]).join('、'),'總計 '+$$(grand));
  return out.join('\n');
}
$('copy').onclick=async()=>{
  const t=lineText();
  try{await navigator.clipboard.writeText(t);toast('已複製,到 LINE 貼上')}
  catch(e){$('bk').value=t;$('bk').select();toast('請長按全選後複製')}
};
$('bkOut').onclick=()=>{$('bk').value=JSON.stringify(S);$('bk').select();toast('已產生,複製起來')};
$('bkIn').onclick=()=>{
  try{S=clean(JSON.parse($('bk').value));render();toast('已讀入')}
  catch(e){toast('備份碼格式不對')}
};
render();
</script>

</body></html>
