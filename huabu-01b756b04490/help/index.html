<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>畫布團購教學影片</title>
<style>
:root{--bg:#eef0f4;--panel:#fff;--ink:#1d2430;--muted:#5b6575;--line:#d7dbe3;--accent:#2a4a9a}
@media (prefers-color-scheme:dark){:root{--bg:#10151f;--panel:#1c2331;--ink:#e8ecf3;--muted:#98a3b5;--line:#2c3547;--accent:#8aa6f0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.6 "Noto Sans TC",system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-left)) 48px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:24px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font-size:19px;margin:0 0 8px}
video{width:100%;max-height:72vh;border-radius:8px;background:#000}
a{color:var(--accent)}
.hint{color:var(--muted);font-size:16px;margin:0}
</style></head><body><div class="wrap">
<h1>畫布團購教學影片</h1>
<p class="hint">每支約 1 分鐘,可以不開聲音,看畫面上的字就懂。</p>
<section class="card" id="vs"><h2>同學怎麼登記</h2><video controls playsinline preload="metadata" poster="student.jpg" src="student.mp4"></video></section>
<section class="card" id="va"><h2>班長怎麼管團購</h2><video controls playsinline preload="metadata" poster="admin.jpg" src="admin.mp4"></video></section>
<section class="card" id="vf"><h2>班長怎麼用收費表(約 2 分半)</h2><video controls playsinline preload="metadata" poster="fee.jpg" src="fee.mp4"></video></section>
<p class="hint"><a href="../">回到畫布團購</a></p>
</div>
<script>
// ?v=student 或 ?v=admin 只顯示其中一支(複製給同學的網址用)
try{var v=new URLSearchParams(location.search).get('v');
if(v==='student'){document.getElementById('va').hidden=true;document.getElementById('vf').hidden=true;}
if(v==='admin'){document.getElementById('vs').hidden=true;document.getElementById('vf').hidden=true;}
if(v==='fee'){document.getElementById('vs').hidden=true;document.getElementById('va').hidden=true;}}catch(e){}
</script></body></html>
