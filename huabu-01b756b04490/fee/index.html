<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>油畫班收費表(新版測試)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --linen:#E3EAD8;        /* 護眼豆沙綠底 */
  --card:#FBFCF4;
  --ink:#2B2620;
  --muted:#6E6754;
  --line:#D6DAC2;
  --vir:#1E6B58;          /* 鉻綠(主色) */
  --vir-deep:#14503F;
  --vir-soft:#E1EEE7;
  --ochre:#B07A22;        /* 土黃 */
  --ochre-soft:#F4E8CF;
  --red:#AF4A3A;
  --red-soft:#F6E3DE;
  --daub:14px 18px 15px 19px; /* 顏料塊圓角 */
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0}
body{
  background:var(--linen);
  color:var(--ink);
  font-family:'Noto Sans TC',system-ui,sans-serif;
  font-size:21px;
  line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,.serif{font-family:'Noto Serif TC',serif}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:21px;color:var(--ink)}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
:focus-visible{outline:3px solid var(--ochre);outline-offset:2px}


/* ── 版面骨架 ── */
#app{max-width:720px;margin:0 auto;padding:0 14px 40px}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:14px 2px 10px;position:sticky;top:0;z-index:20;
  background:var(--linen);
  box-shadow:0 8px 14px -10px rgba(90,75,50,.25);
}
.topbar h1{font-size:29px;font-weight:900;margin:0;flex:1;line-height:1.2;min-width:0}
.home-head{padding:16px 2px 6px}
.home-head h1{font-size:42px;font-weight:900;margin:0;line-height:1.25}
.subline{font-size:22px;color:var(--muted);margin:3px 0 12px}
.navbtns{display:flex;gap:8px}
.navbtns .iconbtn{flex:1;justify-content:center;font-size:27px;height:66px;font-weight:700}
.clstabs{display:flex;gap:4px;background:#EAE5D9;border-radius:14px;padding:4px;margin:0 0 12px}
.clstab{flex:1;padding:16px 0;border-radius:11px;font-weight:700;font-size:28px;color:var(--muted)}
.clstab.on{background:var(--card);color:var(--vir-deep);box-shadow:0 1px 4px rgba(90,75,50,.2)}
.clstab:active{transform:scale(.97)}
.stag{font-size:16px;padding:2px 9px;border-radius:99px;font-weight:700;flex-shrink:0}
.stag-請假{background:var(--ochre-soft);color:#7A5514}
.stag-不參加{background:var(--red-soft);color:var(--red)}
.topbar .sub{font-size:17px;color:var(--muted);font-weight:400;display:block;font-family:'Noto Sans TC'}
.phead{font-size:21px;color:var(--muted);padding:8px 2px 0;line-height:1.5}
.phead-dates{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:2px}
.phead-dates span{white-space:nowrap;font-variant-numeric:tabular-nums}
.iconbtn{
  min-width:56px;height:56px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;
  background:var(--card);border:1px solid var(--line);
  font-size:20px;font-weight:500;padding:0 12px;gap:4px;white-space:nowrap;
}
.iconbtn:active{transform:scale(.96)}


/* ── 卡片 ── */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--daub);
  padding:16px;margin:12px 0;
  box-shadow:0 1px 3px rgba(90,75,50,.07);
}
.period-card{border-left:7px solid var(--vir);padding:14px 16px}
.period-card:active{transform:scale(.99)}
.period-card .row1{display:flex;align-items:baseline;gap:10px}
.period-card .pno{font-size:31px;font-weight:900}
.period-card .dates{font-size:22px;color:var(--muted);margin-top:8px;line-height:1.4}
.period-card .row2{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:18px}
.badge{font-size:16px;padding:3px 10px;border-radius:99px;font-weight:500}
.badge.open{background:var(--vir-soft);color:var(--vir-deep)}
.badge.closed{background:#EAE5D9;color:var(--muted)}


/* ── 顏料進度條 ── */
.smear-wrap{margin-top:10px}
.smear-label{display:flex;justify-content:space-between;font-size:20px;color:var(--muted);margin-bottom:4px}
.smear-label b{color:var(--vir-deep)}
.smear{height:18px;background:#EDE7D8;border-radius:4px 10px 10px 4px;overflow:hidden}
.smear>i{
  display:block;height:100%;
  background:linear-gradient(90deg,var(--vir-deep),var(--vir) 70%,#3E8A72);
  border-radius:4px 12px 14px 4px;
  transition:width .35s ease;
  min-width:0;
}


/* ── 大按鈕 ── */
.bigbtn{
  width:100%;padding:19px;border-radius:var(--daub);
  background:var(--vir);color:#fff;font-size:29px;font-weight:700;
  box-shadow:0 2px 6px rgba(20,80,63,.25);margin:14px 0;
}
.bigbtn:active{transform:scale(.98)}
.bigbtn.ghost{background:var(--card);color:var(--vir-deep);border:1.5px dashed var(--vir);box-shadow:none}


/* ── 學員列 ── */
.stu{background:var(--card);border:1px solid var(--line);border-radius:var(--daub);margin:10px 0;overflow:hidden}
.stu.paid-on{border-color:var(--vir);background:linear-gradient(0deg,var(--vir-soft) 0%,var(--card) 55%)}
.stu-top{display:flex;align-items:center;gap:8px;padding:14px 12px 8px;cursor:pointer;flex-wrap:wrap}
.stu-name{font-size:28px;font-weight:700;flex:1 1 100%;display:flex;align-items:center;gap:8px}
.stu-name .caret{font-size:16px;color:var(--muted);transition:transform .2s}
.stu.expanded .caret{transform:rotate(180deg)}
.stu-total{font-size:27px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
.stu-total.zero{color:var(--muted);font-weight:400}
.paid-btn{
  min-width:96px;height:56px;border-radius:14px;font-weight:700;font-size:20px;
  background:#F0EBDD;color:var(--muted);border:1.5px solid var(--line);
}
.paid-btn.on{background:var(--vir);color:#fff;border-color:var(--vir-deep)}
.paid-btn:active{transform:scale(.94)}
.chips{display:flex;gap:6px;padding:0 12px 12px}
.chip{
  flex:1;height:54px;border-radius:12px;font-size:20px;font-weight:500;
  background:#F0EBDD;color:var(--muted);border:1.5px solid transparent;
}
.chip.sel-上課{background:var(--vir-soft);color:var(--vir-deep);border-color:var(--vir);font-weight:700}
.chip.sel-請假{background:var(--ochre-soft);color:#7A5514;border-color:var(--ochre);font-weight:700}
.chip.sel-不參加{background:var(--red-soft);color:var(--red);border-color:var(--red);font-weight:700}
.paychips{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.pay{
  flex:1;min-width:124px;height:58px;border-radius:12px;font-size:21px;font-weight:500;
  background:#F0EBDD;color:var(--muted);border:1.5px dashed var(--line);white-space:nowrap;
}
.pay.on{background:var(--vir-soft);color:var(--vir-deep);border:1.5px solid var(--vir);font-weight:700}
.stu.paid-part{border-color:var(--ochre);background:linear-gradient(0deg,var(--ochre-soft) 0%,var(--card) 60%)}
.paid-btn.part{background:var(--ochre-soft);color:#7A5514;border-color:var(--ochre)}
.lockbtn{min-width:56px;height:56px;border-radius:14px;font-size:26px;background:#EDEFE2;border:1.5px solid var(--line);flex-shrink:0}
.lockbtn.open{background:var(--ochre-soft);border-color:var(--ochre)}
.paychips.lockdim .pay{opacity:.55}
.ratechips{display:flex;gap:6px;align-items:center;margin:2px 0 4px;flex-wrap:wrap}
.ratechips .chip{flex:0 0 auto;height:50px;padding:0 16px}
.ratechips input.price{width:112px;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:right}
.rateamt{margin-left:auto;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stu-detail{border-top:1px dashed var(--line);padding:12px;background:rgba(245,241,232,.5)}
.field{display:flex;align-items:center;gap:10px;margin:8px 0}
.field label{width:96px;font-size:19px;color:var(--muted);flex-shrink:0}
.field input[type=number],.field input[type=text]{
  flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:12px;background:#fff;
}
.mats{margin:10px 0 4px}
.mats h4{margin:0 0 6px;font-size:19px;color:var(--muted);font-weight:500}
.mat{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line)}
.mat:last-child{border-bottom:none}
.mat .mname{flex:1;font-size:20px}
.mat .mprice{font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.step{display:flex;align-items:center;gap:2px}
.step button{
  width:58px;height:52px;border-radius:12px;background:#F0EBDD;
  font-size:26px;font-weight:700;color:var(--vir-deep);
}
.step button:active{transform:scale(.92)}
.step b{min-width:48px;text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
.step b.zero{color:#C9C0AC}
.removebtn{color:var(--red);font-size:19px;padding:10px 0 2px;display:block}


/* ── 結算卡 ── */
.sumcard{border-left:7px solid var(--ochre)}
.sumcard table{width:100%;border-collapse:collapse;font-size:20px}
.sumcard td{padding:5px 0}
.sumcard td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sumcard tr.grand td{border-top:1.5px solid var(--line);padding-top:9px;font-size:23px}
.sumcard .who{color:var(--muted);font-size:17px;font-weight:400}


/* ── 儲存狀態 ── */
#saveDot{font-size:17px;color:var(--muted);white-space:nowrap;padding:6px 4px}
#saveDot.saving{color:var(--ochre)}
#saveDot.err{color:var(--red);font-weight:700;cursor:pointer}
#saveDot.done{color:var(--vir)}


/* ── 鎖定橫幅 ── */
.lockbar{
  display:flex;align-items:center;gap:10px;background:var(--ochre-soft);
  border:1px solid var(--ochre);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:19px;
}
.lockbar button{color:var(--ochre);font-weight:700;text-decoration:underline}
.locked-area{pointer-events:none;opacity:.75}


/* ── 設定頁列 ── */
.editrow{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.editrow input[type=text]{flex:1 1 180px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.editrow input.price{flex:0 0 110px;min-width:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:right}
.editrow input[type=date]{min-width:0}
.editrow .del{width:54px;height:54px;border-radius:10px;background:var(--red-soft);color:var(--red);font-size:22px;flex-shrink:0}
.switch{
  flex:0 0 88px;height:52px;border-radius:99px;font-size:18px;font-weight:700;
  background:#EAE5D9;color:var(--muted);
}
.switch.on{background:var(--vir-soft);color:var(--vir-deep);border:1.5px solid var(--vir)}
.hint{font-size:18px;color:var(--muted);line-height:1.6;margin:8px 2px}
.roster-item{border:1.5px solid var(--line);border-radius:16px;padding:12px;margin:12px 0;background:#fff}
.setfield label{width:auto;flex:1;font-size:24px;font-weight:700;color:var(--ink)}
.setfield input[type=number]{flex:0 0 150px;margin-left:auto;text-align:right}
.setfield select{flex:0 0 auto !important;min-width:180px;margin-left:auto}


/* ── 對話框 ── */
.overlay{position:fixed;inset:0;background:rgba(43,38,32,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.overlay{align-items:center}}
.dialog{
  background:var(--card);border-radius:20px 20px 0 0;width:100%;max-width:560px;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;
}
@media(min-width:600px){.dialog{border-radius:20px}}
.dialog h2{margin:0 0 14px;font-size:26px}
.dialog .actions{display:flex;gap:10px;margin-top:18px}
.dialog .actions button{flex:1;padding:18px;border-radius:12px;font-size:22px;font-weight:700}
.dialog .actions .ok{background:var(--vir);color:#fff}
.dialog .actions .cancel{background:#EFEADC;color:var(--muted)}
.dialog .danger{color:var(--red);font-size:19px;margin-top:16px;text-align:center;display:block;width:100%}
.datefield{display:flex;align-items:center;gap:10px;margin:8px 0}
.datefield label{width:108px;color:var(--muted);font-size:19px}
.datefield input{flex:1;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff}
.checkline{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:20px}
.checkline input{width:30px;height:30px}


/* ── 加人面板 ── */
.pickwrap{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.pick{
  padding:14px 20px;border-radius:99px;background:#F0EBDD;font-size:20px;
  border:1.5px solid var(--line);font-weight:500;
}
.pick:active{background:var(--vir-soft)}


/* ── 明細表(仿 Excel,可列印)── */
.report-sheet{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 10px;overflow-x:auto}
.report-title{text-align:center;font-size:22px;font-weight:900;margin:2px 0 10px;font-family:'Noto Serif TC'}
.rtable{width:100%;border-collapse:collapse;font-size:18px;min-width:540px}
.rtable th,.rtable td{border:1px solid #999;padding:5px 6px;text-align:center}
.rtable th{background:#F3EFE4;font-weight:700}
.rtable td.name{font-weight:700}
.rtable td.num{text-align:right;font-variant-numeric:tabular-nums}
.rtable td.note{color:var(--red);text-align:left;font-size:16px}
.rtable td.mat{text-align:left;font-size:16px}
.rtable tr.totalrow td{font-weight:700;background:#FAF7EE}
.rtable .split{color:var(--red);text-align:left;font-size:16px}
.paidmark{color:var(--vir);font-weight:900}
.unpaidmark{color:var(--red);font-size:16px}
#reportActions{display:flex;gap:10px;margin:12px 0}
#reportActions button{flex:1;padding:17px;border-radius:12px;font-weight:700;background:var(--card);border:1px solid var(--line)}


@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #printZone,#printZone *{visibility:visible}
  #printZone{position:absolute;left:0;top:0;width:100%}
  .report-sheet{border:none;padding:0}
  .rtable{min-width:0}
}


/* ── 載入畫面 ── */
#loading{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 20px;color:var(--muted)}
.palette-spin{font-size:44px;animation:spin 1.6s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.palette-spin{animation:none}.smear>i{transition:none}}
.footer{color:#B9B09B;font-size:16px;text-align:center;margin-top:30px}
.footer a{color:#B9B09B}
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:10px 20px;border-radius:99px;
  font-size:19px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:.94}
.toast button{color:#FFD98A;font-weight:700;text-decoration:underline;margin-left:12px;font-size:19px}
.empty{color:var(--muted);text-align:center;padding:28px 10px;font-size:20px;line-height:1.7}
/* ── 班費帳本 ── */
.balance{font-size:49px;font-weight:900;text-align:center;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.balance.neg{color:var(--red)}
.bal-sub{display:flex;justify-content:center;gap:14px;font-size:18px;color:var(--muted);flex-wrap:wrap}
.fundrow{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px dotted var(--line);font-size:21px}
.fundrow:last-child{border-bottom:none}
.fundrow .fdate{flex:0 0 92px;color:var(--muted);font-size:20px;font-variant-numeric:tabular-nums}
.fundrow .fitem{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fundrow .famt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.fundrow .famt.in{color:var(--vir-deep)}
.fundrow .famt.out{color:var(--red)}
.fundrow .del{width:52px;height:52px;border-radius:9px;background:var(--red-soft);color:var(--red);flex-shrink:0}
.typebtn{flex:0 0 84px;height:56px;border-radius:10px;font-weight:700;font-size:20px}
.typebtn.in{background:var(--vir-soft);color:var(--vir-deep);border:1.5px solid var(--vir)}
.typebtn.out{background:var(--red-soft);color:var(--red);border:1.5px solid var(--red)}
/* ── 公告板 ── */
.postcard{border-left:7px solid var(--ochre)}
.post{padding:10px 0;border-bottom:1px dotted var(--line);display:flex;gap:8px;align-items:flex-start}
.post:last-child{border-bottom:none}
.post .pbody{flex:1;min-width:0}
.post .pdate{font-size:16px;color:var(--muted);margin-bottom:2px}
.post .ptext{font-size:20px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.post .del{width:48px;height:48px;border-radius:9px;background:var(--red-soft);color:var(--red);flex-shrink:0;font-size:18px}
.postadd textarea{width:100%;min-height:88px;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;resize:vertical;font-size:20px;box-sizing:border-box}
.field select{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:21px}


/* ── 深色模式 ── */
html.dark{
  --linen:#20251E;
  --card:#2B3127;
  --ink:#EAE7DB;
  --muted:#B5AF9C;
  --line:#4A5142;
  --vir:#3E9C7F;
  --vir-deep:#8FD4B8;
  --vir-soft:#294A3D;
  --ochre:#D8A44E;
  --ochre-soft:#4A3D1F;
  --red:#E8846E;
  --red-soft:#4E2A22;
}
html.dark input,html.dark select,html.dark textarea{background:#343B30 !important;color:var(--ink);border-color:var(--line) !important}
html.dark .chip,html.dark .paid-btn,html.dark .pay,html.dark .step button,html.dark .switch,html.dark .typebtn,html.dark .pick,html.dark .lockbtn,html.dark .dialog .actions .cancel,html.dark .clstabs{background:#3A4136;color:var(--muted)}
html.dark .clstab.on{background:#586250;color:var(--vir-deep)}
html.dark .step button{color:var(--vir-deep)}
html.dark .stag-請假,html.dark .chip.sel-請假,html.dark .paid-btn.part{color:#EBC57C}
html.dark .roster-item{background:var(--card)}
html.dark .smear{background:#3A4136}
html.dark .footer,html.dark .footer a{color:#8B8778}
html.dark .rtable th{background:#E8E4D6}
html.dark .toast{background:#000}
.report-sheet{color:#2B2620}
.report-sheet .rtable td.name,.report-sheet .rtable th{color:#2B2620}
.darkbtn{position:absolute;top:14px;right:0;min-width:56px;height:56px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:28px}
.home-head{position:relative}
/* 手機字體被放大時不要擠在一起(先生 11/4 截圖):標題讓出 🌙 的位置、字級隨螢幕寬縮、三顆鈕放不下就換行 */
.home-head h1{padding-right:68px;font-size:clamp(22px,6.3vw,42px)}
.navbtns{flex-wrap:wrap}
.navbtns .iconbtn{flex:1 1 30%;min-width:0;padding-left:6px;padding-right:6px;gap:4px;white-space:nowrap;font-size:clamp(17px,5.4vw,27px)}
.clstab{font-size:clamp(18px,6vw,28px)}
</style>
</head>
<body>
<div id="app">
  <div id="loading"><span class="palette-spin">🎨</span><span>調色中,資料載入…</span></div>
  <div id="view"></div>
</div>
<div id="toast" class="toast"></div>


<script>

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  var QRMode = {

    PATTERN101 : 5,

  };

  if (fn === 'apiSaveSettings') return feePut_('s_' + cls, { normal: p.normal, disc: p.disc, classFee: p.classFee, collector: p.collector });

    var ids = Object.keys(FEE.cache).filter(function (k) { return k.indexOf('p_' + cls + '_') === 0; });

/* ═══════════════ 小工具 ═══════════════ */
function $(id) { return document.getElementById(id); }
/* 放進 onclick="…" 的字串:先 JSON 編碼再 HTML 跳脫 */
function jsq(s) { return esc(JSON.stringify(String(s == null ? '' : s))); }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function money(n) { return '$' + Number(n || 0).toLocaleString('en-US'); }
function toast(msg) {
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm = setTimeout(function () { t.classList.remove('show'); }, 2200);
}
/* 西元 'YYYY/MM/DD' → 民國 '115/07/18' */
function roc(d) {
  var p = String(d).split('/');
  if (p.length !== 3) return d;
  return (Number(p[0]) - 1911) + '/' + p[1] + '/' + p[2];
}
/* 期數日期區間:'115/07/18~08/08(4次)' */
function rocRange(dates) {
  if (!dates.length) return '';
  if (dates.length === 1) return roc(dates[0]);
  var last = String(dates[dates.length - 1]).split('/');
  return roc(dates[0]) + '~' + (last.length === 3 ? last[1] + '/' + last[2] : dates[dates.length - 1]) + '(' + dates.length + '次)';
}
/* 期數日期列:'115/07/18、07/25、08/01、08/08' */
function rocDates(dates) {
  return dates.map(function (d, i) {
    if (i === 0) return roc(d);
    var p = String(d).split('/');
    return p.length === 3 ? p[1] + '/' + p[2] : d;
  }).join('、');
}
function rowsOf(no) {
  var k = String(no);
  if (!S.data.records[k]) S.data.records[k] = [];
  return S.data.records[k];
}
function findPeriod(no) {
  for (var i = 0; i < S.data.periods.length; i++)
    if (S.data.periods[i].no === no) return S.data.periods[i];
  return null;
}
function matPrice(name) {
  for (var i = 0; i < S.data.materials.length; i++)
    if (S.data.materials[i].name === name) return S.data.materials[i].price;
  return 0;
}
function rosterOf(name) {
  for (var i = 0; i < S.data.roster.length; i++)
    if (S.data.roster[i].name === name) return S.data.roster[i];
  return null;
}
function tuitionOfEntry(r) {
  if (!r) return S.data.settings.normal;
  if (r.rate === '優惠') return S.data.settings.disc;
  if (r.rate === '自訂') return Number(r.custom) || 0;
  return S.data.settings.normal;
}
function tuitionOf(name) { return tuitionOfEntry(rosterOf(name)); }
/* 繳費狀態:'full' 全繳|'part' 部分|'none' 未繳|'na' 金額0 */
function payState(r) {
  var buckets = [[r.fee, r.paidFee], [r.classFee, r.paidClass], [r.matSubtotal, r.paidMat]]
    .filter(function (b) { return Number(b[0]) > 0; });
  if (!buckets.length) return 'na';
  var paid = buckets.filter(function (b) { return b[1]; }).length;
  return paid === buckets.length ? 'full' : (paid > 0 ? 'part' : 'none');
}
function paidAmount(r) {
  return (r.paidFee ? Number(r.fee || 0) : 0) +
         (r.paidClass ? Number(r.classFee || 0) : 0) +
         (r.paidMat ? r.matSubtotal : 0);
}
/* 重算某列的材料小計/明細/合計 */
function recalcRow(r) {
  var sub = 0, parts = [];
  Object.keys(r.mats || {}).forEach(function (k) {
    var q = Number(r.mats[k] || 0);
    if (q > 0) {
      /* 單價以「這一期當時」為準:第一次算到就記進這一列(r.mp),之後材料庫漲價/改名/刪除都不影響舊期(先生 11/4:價錢會漲,半年前的帳不能變) */
      if (!r.mp) r.mp = {};
      if (r.mp[k] === undefined) r.mp[k] = matPrice(k);
      sub += q * r.mp[k]; parts.push(k + '×' + q);
    }
  });
  r.matSubtotal = sub;
  r.matText = parts.join('、');
  r.total = Number(r.fee || 0) + Number(r.classFee || 0) + sub;
}
function summary(no) {
  var rows = rowsOf(no), s = { due: 0, paidCnt: 0, sumDue: 0, sumPaid: 0, tuition: 0, classFee: 0, mat: 0, total: 0 };
  rows.forEach(function (r) {
    recalcRow(r);
    s.tuition += Number(r.fee || 0);
    s.classFee += Number(r.classFee || 0);
    s.mat += r.matSubtotal;
    s.total += r.total;
    if (r.total > 0) {
      s.due++; s.sumDue += r.total;
      s.sumPaid += paidAmount(r);
      if (payState(r) === 'full') s.paidCnt++;
    }
  });
  return s;
}


/* ═══════════════ 自動存檔 ═══════════════ */
function markDirty() {
  if (S.dirty && S.dirtyCur != null && S.dirtyCur !== S.cur) flushSave();   // 換期數前先把上一期送出
  S.dirty = true; S.dirtyCur = S.cur;
  setSaveDot('儲存中…', 'saving');
  clearTimeout(S.saveTimer);
  S.saveTimer = setTimeout(flushSave, 1200);
}
function flushSave() {
  clearTimeout(S.saveTimer);
  var cur = (S.dirtyCur != null) ? S.dirtyCur : S.cur;   // 按返回後 S.cur 變 null,仍要存剛剛那一期(Grok 審查 #6)
  if (!S.dirty || cur === null || S.saving) return;
  var p = findPeriod(cur);
  if (!p) { S.dirty = false; return; }
  S.saving = true;
  S.dirty = false;
  var rows = rowsOf(cur);
  rows.forEach(recalcRow);
  api('apiSavePeriod', { cls: S.cls, no: p.no, dates: p.dates, status: p.status, posts: p.posts || [], rows: rows })
    .then(function () {
      S.saving = false;
      if (S.dirty) { flushSave(); return; }
      var t = new Date();
      setSaveDot('已儲存 ✓ ' + ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2), 'done');
    })
    .catch(function (e) {
      S.saving = false; S.dirty = true;
      setSaveDot('❗儲存失敗,點此重試', 'err');
      console.error(e);
    });
}
function setSaveDot(text, cls) {
  var d = $('saveDot');
  if (!d) return;
  d.textContent = text;
  d.className = cls || '';
}
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'hidden' && S.dirty) flushSave();
});
window.addEventListener('beforeunload', function (e) {
  if (S.dirty) { flushSave(); e.preventDefault(); e.returnValue = ''; }
});


/* ═══════════════ 啟動 ═══════════════ */
/* 舊資料(還沒記單價的各期)登入時一次把「現在的單價」記進去並存檔,之後材料庫改價就不會動到它們 */
async function freezeOldPrices_() {
  try {
    for (var ci = 0; ci < CLS_LIST.length; ci++) {
      var c = CLS_LIST[ci], cd = S.all[c]; if (!cd) continue;
      var price = function (n) { for (var i = 0; i < cd.materials.length; i++) if (cd.materials[i].name === n) return cd.materials[i].price; return 0; };
      for (var pi = 0; pi < cd.periods.length; pi++) {
        var p = cd.periods[pi], rows = cd.records[String(p.no)] || [], ch = false;
        rows.forEach(function (r) {
          var need = Object.keys(r.mats || {}).filter(function (k) { return Number(r.mats[k] || 0) > 0 && !(r.mp && r.mp[k] !== undefined); });
          if (need.length) { r.mp = r.mp || {}; need.forEach(function (k) { r.mp[k] = price(k); }); ch = true; }
        });
        if (ch) await api('apiSavePeriod', { cls: c, no: p.no, dates: p.dates, status: p.status, posts: p.posts || [], rows: rows });
      }
    }
  } catch (e) { console.warn('凍結舊期單價失敗(下次登入會再試)', e); }
}
function bootData_() {
  api('apiLoad').then(function (data) {
    S.all = data.classes;
    S.sheetUrl = data.sheetUrl || '';
    if (!S.all[S.cls]) S.cls = CLS_LIST[0];
    S.data = S.all[S.cls];
    $('loading').style.display = 'none';
    renderHome();

function roundRect_(ctx, x, y, w, h, r) {
  ctx.beginPath();

  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawReportJpg() {

  };
  var cv = document.createElement('canvas');

    for (var i = 0; i < text.length; i++) {

  var detailFont = F(26, false);

  });

  var y = headerH;

/* 一鍵匯出訂購及繳費情形(先生 11/4):文字版給 LINE/記事本,表格版(Tab 分隔)貼進 Excel/Google 試算表,CSV 版下載 */
function gbExportData_() {
  var r = gbRound_(), t = gbCalc_(r, G.orders, gbPay_(r.id)), pay = gbPay_(r.id), sizes = [];
  t.list.forEach(function (p) { Object.keys(p.items).forEach(function (k) { if (sizes.indexOf(k) < 0) sizes.push(k); }); });
  sizes.sort(gbSizeSort_);

}
function gbStat_(p) { return p.due <= 0 && p.paid <= 0 ? '—' : (p.paid >= p.due ? '已收齊' : (p.paid > 0 ? '部分' : '未收')); }
function gbExportText() {
  var d = gbExportData_(), r = d.r, t = d.t, L = [];
  L.push('【' + r.name + ' 訂購及繳費情形】(' + (r.closed ? '已結單' : '登記中') + ')');
  if (t.ship) L.push('(應收已含運費 ' + money(t.ship) + ',按片數平均分)');
  L.push('共 ' + t.cnt + ' 人、' + t.pieces + ' 片;應收 ' + money(t.due) + ',已收 ' + money(t.paid) + ',未收 ' + money(Math.max(0, t.due - t.paid)));
  if (d.pay.advance) L.push('班長墊付 ' + money(d.pay.advance) + ',' + (d.pay.advance - t.paid > 0 ? '還差 ' + money(d.pay.advance - t.paid) + ' 才回本' : '已回本'));
  L.push('');
  t.list.forEach(function (p) {
    L.push(p.name + ':' + gbItemsTxt_(p) + '|應收 ' + money(p.due) + '|已收 ' + money(p.paid) + (p.due - p.paid > 0 ? '|還差 ' + money(p.due - p.paid) : '') + '|' + gbStat_(p));
  });
  if (!t.list.length) L.push('(還沒有人登記)');
  gbCopy_(L.join('\n'), '已複製文字,可貼到 LINE 或記事本');
}
/* 文字儲存格防公式注入:名字是同學自己輸入的,=、+、-、@ 開頭貼進試算表會被當公式 → 前面補單引號;Tab/換行換成空格 */
function gbCell_(c) {
  if (typeof c === 'number') return c;
  c = String(c).replace(/[\t\r\n]+/g, ' ');
  return /^[\s"'＂＇]*[=+\-@＝＋－＠]/.test(c) ? "'" + c : c;
}
function gbTableRows_() {
  var d = gbExportData_(), t = d.t, rows = [];
  rows.push(['姓名'].concat(d.sizes, ['總片數'], t.ship ? ['運費'] : [], ['應收', '已收', '未收', '狀態']));
  t.list.forEach(function (p) {
    rows.push([p.name].concat(d.sizes.map(function (k) { return p.items[k] || ''; }), [p.pieces], t.ship ? [p.ship] : [], [p.due, p.paid, Math.max(0, p.due - p.paid), gbStat_(p)]));
  });
  var sum = d.sizes.map(function (k) { return t.list.reduce(function (a, p) { return a + (p.items[k] || 0); }, 0) || ''; });
  rows.push(['合計'].concat(sum, [t.pieces], t.ship ? [t.ship] : [], [t.due, t.paid, Math.max(0, t.due - t.paid), '']));
  return rows.map(function (row) { return row.map(gbCell_); });
}
function gbExportTable() {
  gbCopy_(gbTableRows_().map(function (r) { return r.join('\t'); }).join('\n'), '已複製表格,到 Excel / Google 試算表按貼上');
}
function gbExportCsv() {
  var r = gbRound_();
  var csv = gbTableRows_().map(function (row) { return row.map(function (c) { c = String(c); return /[",\r\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }));
  a.download = (r.name || '團購') + '_訂購及繳費.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('已下載 CSV');
}
/* 複製成圖片(先生 11/4):把訂購及繳費表畫成一張 PNG(固定淺色白底,LINE 裡看最清楚),放進剪貼簿;不支援就跳出圖,可分享/長按存圖 */
function gbDrawImage_() {
  var d = gbExportData_(), t = d.t, r = d.r, S2 = 2, PAD = 14, RH = 38, FS = 20, FONT = '"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  var head = ['姓名'].concat(d.sizes, ['片數'], t.ship ? ['運費'] : [], ['應收', '已收', '未收', '狀態']);
  var body = t.list.map(function (p) {
    var left = Math.max(0, p.due - p.paid);
    return { st: gbStat_(p), cells: [p.name].concat(d.sizes.map(function (k) { return p.items[k] ? String(p.items[k]) : ''; }), [String(p.pieces)], t.ship ? [money(p.ship)] : [], [money(p.due), money(p.paid), left ? money(left) : '', gbStat_(p)]) };
  });
  var sum = d.sizes.map(function (k) { return String(t.list.reduce(function (a, p) { return a + (p.items[k] || 0); }, 0) || ''); });
  var foot = ['合計'].concat(sum, [String(t.pieces)], t.ship ? [money(t.ship)] : [], [money(t.due), money(t.paid), money(Math.max(0, t.due - t.paid)), '']);
  var rows = [head].concat(body.map(function (b) { return b.cells; }), [foot]);
  var m = document.createElement('canvas').getContext('2d'); m.font = '600 ' + FS + 'px ' + FONT;
  var W = head.map(function (_, c) { return Math.max.apply(null, rows.map(function (row) { return m.measureText(row[c]).width; })) + 22; });
  var tw = W.reduce(function (a, b) { return a + b; }, 0), titleH = 92, noteH = d.pay.advance ? 40 : 0;
  var CW = Math.max(tw, 420), H = titleH + RH * rows.length + noteH + 2 * PAD;
  var cv = document.createElement('canvas'); cv.width = (CW + 2 * PAD) * S2; cv.height = H * S2;
  var x = cv.getContext('2d'); x.scale(S2, S2); x.textBaseline = 'middle';
  x.fillStyle = '#fff'; x.fillRect(0, 0, CW + 2 * PAD, H);
  x.fillStyle = '#2B2620'; x.font = '700 28px ' + FONT; x.textAlign = 'left';
  x.fillText(r.name + ' 訂購及繳費情形', PAD, PAD + 24);
  x.font = '500 19px ' + FONT; x.fillStyle = '#6b6558';
  var dt = new Date(), ds = (dt.getMonth() + 1) + '/' + dt.getDate();
  x.fillText('共 ' + t.cnt + ' 人、' + t.pieces + ' 片・' + (r.closed ? '已結單' : '登記中') + '・' + ds + ' 更新', PAD, PAD + 62);
  var y = PAD + titleH - 16, i, c, px;
  rows.forEach(function (row, ri) {
    var isHead = ri === 0, isFoot = ri === rows.length - 1, st = isHead || isFoot ? '' : body[ri - 1].st;
    x.fillStyle = isHead ? '#2f6b57' : isFoot ? '#E6EBD9' : st === '已收齊' ? '#E3F1E8' : st === '部分' ? '#FBF0D6' : (ri % 2 ? '#fff' : '#F7F8F1');
    x.fillRect(PAD, y, CW, RH);
    px = PAD;
    for (c = 0; c < row.length; c++) {
      var w = W[c] * (CW / tw > 1 ? CW / tw : 1), isNum = c > 0 && c < row.length - 1;
      x.font = (isHead || isFoot || c === 0 ? '700 ' : '500 ') + FS + 'px ' + FONT;
      x.fillStyle = isHead ? '#fff' : '#2B2620';
      if (!isHead && c === row.length - 2 && row[c]) x.fillStyle = '#B23A2E';
      if (!isHead && !isFoot && c === row.length - 1) x.fillStyle = st === '已收齊' ? '#2f6b57' : st === '未收' ? '#B23A2E' : '#8a6a1c';
      x.textAlign = isNum ? 'center' : 'left';
      x.fillText(row[c], isNum ? px + w / 2 : px + 10, y + RH / 2 + 1);
      px += w;
    }
    x.strokeStyle = '#cfd3c2'; x.lineWidth = 1; x.beginPath(); x.moveTo(PAD, y + RH - .5); x.lineTo(PAD + CW, y + RH - .5); x.stroke();
    y += RH;
  });
  px = PAD; x.strokeStyle = '#cfd3c2';
  for (c = 0; c <= head.length; c++) { x.beginPath(); x.moveTo(px + .5, PAD + titleH - 16); x.lineTo(px + .5, y); x.stroke(); if (c < head.length) px += W[c] * (CW / tw > 1 ? CW / tw : 1); }
  if (d.pay.advance) {
    var df = d.pay.advance - t.paid; x.textAlign = 'left'; x.font = '600 20px ' + FONT; x.fillStyle = df > 0 ? '#B23A2E' : '#2f6b57';
    x.fillText('班長墊付 ' + money(d.pay.advance) + ',' + (df > 0 ? '還差 ' + money(df) + ' 才回本' : '已回本'), PAD, y + 26);
  }
  return cv;
}
function gbShowImage_(blob, name) {
  var url = URL.createObjectURL(blob), can = navigator.canShare && navigator.canShare({ files: [new File([blob], name, { type: 'image/png' })] });
  openDialog('<h3 style="margin:0 0 8px">🖼 訂購及繳費圖</h3><div class="hint" style="margin:0 0 8px">這台手機不能直接放進剪貼簿。' + (can ? '按下面「分享」選 LINE 群組;' : '') + '或<b>長按圖片 → 儲存圖片</b>,再到 LINE 傳。</div>' +
    '<img src="' + url + '" style="width:100%;border:1px solid var(--line);border-radius:8px;display:block;margin-bottom:10px" alt="訂購及繳費表">' +
    (can ? '<button class="bigbtn" id="gbImgShare" style="margin-bottom:8px">📤 分享(選 LINE)</button>' : '') + '<button class="bigbtn ghost" onclick="closeDialog()">關閉</button>');
  var sb = $('gbImgShare');
  if (sb) sb.onclick = function () { navigator.share({ files: [new File([blob], name, { type: 'image/png' })], title: name }).catch(function () {}); };
}
async function gbExportImage() {
  var r = gbRound_(); if (!r) return;
  var name = (r.name || '團購') + '_訂購及繳費.png', blob;
  try {
    blob = await new Promise(function (ok, no) { gbDrawImage_().toBlob(function (b) { b ? ok(b) : no(new Error('toBlob')); }, 'image/png'); });
  } catch (e) { toast('畫圖沒成功:' + ((e && e.message) || e)); return; }
  try {
    if (!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write)) throw new Error('no clipboard image');
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    toast('已複製圖片,到 LINE 長按輸入框貼上');
  } catch (e) { gbShowImage_(blob, name); }
}
function gbCopyRemind() {
  var r = gbRound_(), t = gbCalc_(r, G.orders, gbPay_(r.id)), un = t.list.filter(function (p) { return p.due - p.paid > 0; });
  var lines = ['【' + r.name + ' 收款】', '已收 ' + money(t.paid) + ' / 應收 ' + money(t.due)];
  if (!un.length) lines.push('全部收齊了,謝謝大家 🙏');
  else { lines.push('還沒收到:'); un.forEach(function (p) { lines.push(p.name + ' ' + money(p.due - p.paid) + '(' + gbItemsTxt_(p) + ')'); }); lines.push('麻煩上課時交給我,謝謝!'); }
  gbCopy_(lines.join('\n'), '收款提醒已複製,貼到 LINE');
}
